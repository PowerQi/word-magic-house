<title>单词魔法屋 · 四年级</title>
<style>
:root{
  --pink:#ff8fb1; --pink-d:#e8638c; --purple:#a78bfa; --purple-d:#8b5cf6;
  --mint:#5eead4; --yellow:#fcd34d; --sky:#7dd3fc; --ink:#4a3b52; --ink2:#8b7a93;
  --card:#ffffff; --bg1:#fff0f7; --bg2:#f3edff; --line:#ede4ff;
  --ok:#34d399; --bad:#fb7185;
  --r:22px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  color:var(--ink); background:linear-gradient(160deg,var(--bg1),var(--bg2));
  min-height:100%; overflow-x:hidden;
}
.app{max-width:820px;margin:0 auto;padding:14px 14px calc(30px + env(safe-area-inset-bottom));position:relative}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:13px 24px;border-radius:16px;font-size:17px;font-weight:700;
  background:linear-gradient(135deg,var(--pink),var(--purple));color:#fff;
  box-shadow:0 6px 0 rgba(139,92,246,.25);transition:transform .08s,box-shadow .08s;
}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(139,92,246,.25)}
.btn.ghost{background:#fff;color:var(--purple-d);box-shadow:0 4px 0 rgba(167,139,250,.18);border:2px solid #ede4ff}
.btn.mint{background:linear-gradient(135deg,#5eead4,#38bdf8);box-shadow:0 6px 0 rgba(56,189,248,.25)}
.btn.gray{background:#f1eef5;color:var(--ink2);box-shadow:0 4px 0 rgba(0,0,0,.05)}
.btn:disabled{opacity:.45;pointer-events:none}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.brand{font-size:19px;font-weight:900;letter-spacing:.5px;
  background:linear-gradient(90deg,var(--pink-d),var(--purple-d));-webkit-background-clip:text;background-clip:text;color:transparent}
.iconbtn{width:40px;height:40px;border-radius:13px;background:#fff;display:flex;align-items:center;justify-content:center;
  font-size:19px;box-shadow:0 3px 0 rgba(0,0,0,.05)}
.card{background:var(--card);border-radius:var(--r);padding:18px;box-shadow:0 8px 24px rgba(167,139,250,.13);margin-bottom:14px}
.center{text-align:center}
.muted{color:var(--ink2);font-size:14px;line-height:1.6}
.big{font-size:26px;font-weight:900}
.row{display:flex;align-items:center;gap:10px}
.spread{display:flex;align-items:center;justify-content:space-between}
.pill{display:inline-flex;align-items:center;gap:5px;padding:5px 12px;border-radius:999px;font-size:13px;font-weight:700;background:#f6f0ff;color:var(--purple-d)}
.pill.y{background:#fff6d6;color:#b4790a}.pill.g{background:#dcfce7;color:#15803d}.pill.p{background:#ffe4ef;color:var(--pink-d)}

/* 首页 */
.hero{background:linear-gradient(135deg,#ffc9dd,#d6c9ff);border-radius:26px;padding:22px;color:#5b3a63;position:relative;overflow:hidden}
.hero h1{margin:0 0 6px;font-size:24px}
.hero .sub{font-size:14px;opacity:.85}
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.stat{background:rgba(255,255,255,.75);border-radius:16px;padding:10px;text-align:center}
.stat b{display:block;font-size:21px;line-height:1.2}
.stat span{font-size:12px;opacity:.75}
.stars{display:flex;gap:4px;justify-content:center;margin-top:10px;font-size:18px}

/* 词卡 */
.wordart{width:150px;height:150px;margin:0 auto}
.wordart.emoji{display:flex;align-items:center;justify-content:center;font-size:86px;line-height:1}
.wordbig{font-size:44px;font-weight:900;letter-spacing:2px;margin:6px 0 2px;word-break:break-word}
.cn{font-size:19px;color:var(--purple-d);font-weight:700}
.syl{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:10px 0}
.syl span{background:#f6f0ff;color:var(--purple-d);padding:4px 12px;border-radius:10px;font-weight:700;font-size:16px;letter-spacing:1px}
.syl span.dots{background:#f2eefa;color:#c3b2da;letter-spacing:4px;padding:4px 14px}
.sent{background:#fbf7ff;border-radius:14px;padding:10px 12px;margin-top:10px;font-size:14px;line-height:1.6}
.sent i{color:var(--ink2);font-style:normal;font-size:13px}

/* 拼写 */
.slots{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;margin:16px 0 8px}
.slot{width:44px;height:56px;border-radius:12px;background:#fff;border:3px solid #e8dff5;
  display:flex;align-items:center;justify-content:center;font-size:27px;font-weight:900}
.slot.filled{border-color:var(--purple);background:#faf5ff;color:var(--purple-d)}
.slot.locked{background:#f4f0fa;border-style:dashed;border-color:#ddd2ec;color:#b9a9c9}
.slot.cur{border-color:var(--pink);box-shadow:0 0 0 4px rgba(255,143,177,.22);transform:scale(1.06)}
.slot.err{border-color:var(--bad);background:#fff1f3;animation:shake .35s}
.slot.ok{border-color:var(--ok);background:#ecfdf5;color:#0f766e}
.slot.gap{width:26px;border:none;background:none}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.hintbar{min-height:34px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:15px;font-weight:700;color:var(--purple-d)}
.clue{font-size:15px;color:var(--ink2);margin-bottom:2px}
.clue b{color:var(--ink)}

/* 键盘 */
.kb{max-width:660px;margin:6px auto 0;user-select:none}
.kbrow{display:flex;gap:6px;justify-content:center;margin-bottom:6px}
.k{padding:0;border-radius:11px;height:48px;flex:1;max-width:56px;font-size:19px;font-weight:800;
  color:#5b4a63;box-shadow:0 3px 0 rgba(0,0,0,.09);transition:transform .06s}
.k:active{transform:translateY(3px);box-shadow:none}
.k.wide{max-width:110px;font-size:14px}
.k.target{outline:4px solid var(--pink);outline-offset:1px;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
.k.dim{opacity:.5}

/* 结算 */
.score2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0}
.sc{background:#fbf7ff;border-radius:18px;padding:14px;text-align:center}
.sc b{display:block;font-size:30px;line-height:1.1}
.sc span{font-size:13px;color:var(--ink2)}
.ticket{background:linear-gradient(135deg,#fff3c4,#ffe0ef);border:2px dashed #f0a9c8;border-radius:18px;padding:14px;text-align:center}

/* 抽奖 */
.gcard{width:170px;height:230px;margin:0 auto;border-radius:20px;background:linear-gradient(160deg,#fff,#f6f0ff);
  border:4px solid #e8dff5;display:flex;align-items:center;justify-content:center;overflow:hidden;transition:transform .4s}
.gcard.flip{transform:rotateY(180deg) scale(1.04)}
.gcard.r-R{border-color:#d7d3e0}.gcard.r-S{border-color:#a7f3d0}.gcard.r-SR{border-color:#a5b4fc}.gcard.r-SSR{border-color:#fcd34d;box-shadow:0 0 0 6px rgba(252,211,77,.25)}
.rar{display:inline-block;padding:3px 12px;border-radius:999px;font-weight:900;font-size:13px;letter-spacing:1px}
.rar.R{background:#eceaf2;color:#7c7488}.rar.S{background:#d1fae5;color:#047857}
.rar.SR{background:#e0e7ff;color:#4338ca}.rar.SSR{background:linear-gradient(90deg,#fde68a,#fca5a5);color:#7c2d12}

/* 衣柜 */
.dollbox{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap;justify-content:center}
.doll{width:250px;height:320px;border-radius:20px;background:linear-gradient(160deg,#fdf3ff,#eef4ff)}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:10px;max-width:340px}
.item{background:#fff;border-radius:14px;padding:8px;text-align:center;border:3px solid #f0e8fa;position:relative}
.item.on{border-color:var(--pink);box-shadow:0 0 0 3px rgba(255,143,177,.18)}
.item.locked{opacity:.42}
.item .nm{font-size:12px;font-weight:700;margin-top:4px}
.tabs{display:flex;gap:8px;justify-content:center;margin-bottom:12px;flex-wrap:wrap}
.tab{padding:7px 15px;border-radius:999px;background:#fff;font-weight:700;font-size:14px;color:var(--ink2)}
.tab.on{background:linear-gradient(135deg,var(--pink),var(--purple));color:#fff}

/* 弹窗 */
#mask{position:fixed;inset:0;background:rgba(74,59,82,.45);display:none;align-items:center;justify-content:center;padding:18px;z-index:50}
#mask.show{display:flex}
#modal{background:#fff;border-radius:24px;padding:20px;max-width:420px;width:100%;max-height:86vh;overflow:auto;text-align:center}
#modal h3{margin:0 0 10px;font-size:20px}
.toast{position:fixed;left:50%;top:24px;transform:translateX(-50%);background:rgba(74,59,82,.92);color:#fff;
  padding:10px 20px;border-radius:14px;font-weight:700;font-size:15px;z-index:99;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.show{opacity:1}
.fade{animation:fade .3s}@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.bar{height:9px;border-radius:99px;background:#efe8f7;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pink),var(--purple));transition:width .4s}
.timer{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.timer .bar{flex:1}

/* 可点击统计 */
.stat.clickable{cursor:pointer;transition:transform .1s,background .15s}
.stat.clickable:active{transform:scale(.96)}
.stat.clickable:hover{background:rgba(255,255,255,.95)}
.lnk{cursor:pointer;text-decoration:underline dotted;text-underline-offset:3px}

/* 学习档案切换 */
.pbar{display:flex;gap:10px;margin-bottom:12px}
.pchip{flex:1;display:flex;align-items:center;gap:9px;background:var(--card);border:2.5px solid transparent;
  border-radius:18px;padding:8px 10px;cursor:pointer;text-align:left;box-shadow:0 3px 0 rgba(0,0,0,.04);transition:.15s}
.pchip.on{border-color:var(--pink-d);background:#fff6fa}
.pchip:not(.on){opacity:.6}
.pchip .ptxt{display:flex;flex-direction:column;line-height:1.25;min-width:0}
.pchip .pn{font-weight:800;font-size:14px;color:var(--ink)}
.pchip .pd{font-size:11px;opacity:.7;color:var(--ink2)}
.pchip svg{display:block;border-radius:50%;flex:none}
.avpick{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:10px 0 4px}
.avbtn{width:46px;height:46px;border-radius:50%;border:3px solid transparent;background:none;padding:2px;cursor:pointer}
.avbtn.on{border-color:var(--pink-d);background:#fff0f6}
.namerow{display:flex;align-items:center;gap:8px;margin:6px 0}
.namerow input{flex:1;border:2px solid var(--line);border-radius:12px;padding:8px 12px;font-size:15px;font-weight:700;color:var(--ink);background:#fff}

/* 单词列表 */
#modal.wide{max-width:560px}
.wgrp{margin:14px 0 6px;font-size:13px;font-weight:700;color:var(--ink2);text-align:left}
.wrow{display:flex;align-items:center;gap:8px;background:#fbf7ff;border-radius:14px;padding:8px 10px;margin-bottom:7px;text-align:left;cursor:pointer}
.wrow .w{font-size:16px;font-weight:800;min-width:96px}
.wrow .cn{font-size:14px;color:var(--ink2);flex:1}
.wbadge{font-size:11px;font-weight:800;padding:3px 9px;border-radius:999px;white-space:nowrap}
.wbadge.b0{background:#f1efe8;color:#7c7488}
.wbadge.b1{background:#fff3c4;color:#a16207}
.wbadge.b2{background:#d1fae5;color:#047857}
.wbadge.b3{background:#e0e7ff;color:#4338ca}
.wmini{padding:5px 10px;border-radius:10px;font-size:12px;font-weight:800;background:#fff;border:2px solid #e8dff5;color:var(--purple-d);white-space:nowrap;font-family:inherit;cursor:pointer}
.wmini:active{transform:translateY(2px)}
.wmini.dim{opacity:.45}
.wmini.on{background:#efe7ff;border-color:#a78bfa;color:#6d28d9}
.wmini.del{border-color:#f3c7d2;color:#db2777}
.wempty{padding:26px 10px;color:var(--ink2);font-size:14px;line-height:1.7}
</style>
</head>

}

function newProf(name,av){
  const p=JSON.parse(JSON.stringify(DEF_SAVE));
  p.name=name||'小朋友'; p.av=av||0;
  ['bg_sakura','hair_long','dress_pink','shoe_flat'].forEach(function(id){ p.gacha.owned.push(id); });

function normProf(p){
  if(!p.words) p.words={};
  if(!p.day) p.day={};
  if(!Array.isArray(p.week)||p.week.length!==7) p.week=[false,false,false,false,false,false,false];
  if(!p.gacha) p.gacha={tickets:0,pity:0,total:0,owned:[],star:0};
  ['tickets','pity','total','star'].forEach(function(k){ if(typeof p.gacha[k]!=='number') p.gacha[k]=0; });
  if(!Array.isArray(p.gacha.owned)) p.gacha.owned=[];
  p.gacha.owned=p.gacha.owned.filter(function(id){ return ITEMS.some(function(i){ return i.id===id; }); });
  if(!p.equip) p.equip={};
  Object.keys(BARE).forEach(function(k){ if(!(k in p.equip)) p.equip[k]=BARE[k]; });
  if(!p.equip.bg) p.equip.bg='bg_sakura';
  if(!p.equip.shoes) p.equip.shoes='shoe_flat';
  Object.keys(p.equip).forEach(function(k){ if(p.equip[k]&&!p.gacha.owned.includes(p.equip[k])) p.equip[k]=BARE[k]!==undefined?BARE[k]:null; });
  ['bg_sakura','hair_long','dress_pink','shoe_flat'].forEach(function(id){ if(p.gacha.owned.indexOf(id)<0) p.gacha.owned.push(id); });
  if(!p.settings) p.settings={sound:true,tts:true,gacha:true};
  if(!Array.isArray(p.extra)) p.extra=[];   // 想今天学的未学词（手动标记）
  if(typeof p.av!=='number'||p.av<0||p.av>=AVATARS.length) p.av=0;
  if(!p.name) p.name='小朋友';
  if(!p.book) p.book='4A';
  return p;
}

  }else{

    try{ old=JSON.parse(localStorage.getItem(OLD_KEY)); }catch(e){}

(function(){

  const o=a.createOscillator(),g=a.createGain(); o.type=type||'sine'; o.frequency.value=f;
  g.gain.setValueAtTime(vol||.18,a.currentTime); g.gain.exponentialRampToValueAtTime(.001,a.currentTime+d);
  o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime+d); }

/* 错误分型 */
const NEAR={'b':'d','d':'b','p':'q','q':'p','m':'n','n':'m','u':'v','v':'u','e':'a','a':'e','i':'e','o':'u','u':'o'};
function classify(u,t){
  u=norm(u); t=norm(t);
  if(u===t) return null;
  const uu=u.replace(/ /g,''), tt=t.replace(/ /g,'');
  if(uu.length<tt.length){
    for(let i=0;i<tt.length;i++){ if(uu.slice(0,i)+tt.slice(i+1)===uu) return {type:'miss',ch:tt[i],msg:'少了字母 <b>'+tt[i]+'</b>'}; }
  }
  if(uu.length>tt.length){ for(let i=0;i<uu.length;i++){ if(uu.slice(0,i)+uu.slice(i+1)===tt) return {type:'extra',ch:uu[i],msg:'多写了字母 <b>'+uu[i]+'</b>'}; } }
  if(uu.length===tt.length){
    const diffs=[]; for(let i=0;i<tt.length;i++) if(uu[i]!==tt[i]) diffs.push(i);
    if(diffs.length===1){ const i=diffs[0], a=uu[i], b=tt[i];
      if(NEAR[a]===b) return {type:'near',msg:'<b>'+a+'</b> 和 <b>'+b+'</b> 长得太像啦，看清楚'};
      return {type:'sub',msg:'第 '+(i+1)+' 个字母应该是 <b>'+b+'</b>'};
    }
    if(diffs.length<=2 && uu.split('').sort().join('')===tt.split('').sort().join(''))
      return {type:'order',msg:'字母都对，<b>顺序反了</b>'};
    if(diffs.length) return {type:'sub',msg:'第 '+(diffs[0]+1)+' 个字母应该是 <b>'+tt[diffs[0]]+'</b>'};
  }
  return {type:'other',msg:'再听一遍，然后慢慢拼'};
}

/* ============================================================
   7. 调度
   ============================================================ */
const MODES=['pic','cn','audio'];
function pickMode(w){
  const st=ws(w), left=MODES.filter(m=>!st.modes.includes(m));
  const m = left.length? left[Math.floor(Math.random()*left.length)] : MODES[Math.floor(Math.random()*MODES.length)];
  if(!st.modes.includes(m)) st.modes.push(m);
  if(st.modes.length>=MODES.length) st.modes=[m];
  return m;
}
function dueWords(){
  const dn=dayNum(), out=[];
  for(const w in S.words){ const st=S.words[w];
    if(st.st===0) continue;               // 没见过面
    if(!BY_W[w]) continue;                // 词表已无此词（如自定义词被删），跳过
    if(st.due<=dn) out.push({w,over:dn-st.due,st});
  }
  out.sort((a,b)=>{
    if(b.over!==a.over) return b.over-a.over;        // 逾期越久越先
    if(a.st.fails!==b.st.fails) return b.st.fails-a.st.fails; // 加强队列优先
    return a.st.st-b.st.st;                          // 状态低的先
  });
  return out.map(x=>x.w);
}
function freshWords(n, excl){
  // 只要还没「拼得出」(st===0) 就算新词 —— 见过卡但没拼写就退出的词不会被丢掉
  const skip=excl||{};
  const out=[];
  for(const x of WORDS){ if(out.length>=n) break; const st=S.words[x.w]; if((!st||st.st===0) && !skip[x.w]) out.push(x.w); }
  return out;
}
/* 手动标记「想今天学」的未学词（来自 S.extra），已学会的会被剔除 */
function pickedExtra(){
  return (S.extra||[]).filter(function(w){ return BY_W[w] && (!S.words[w]||S.words[w].st===0); });
}
function pickedSet(arr){ const o={}; (arr||[]).forEach(function(w){ o[w]=1; }); return o; }
/* 今天的新词数量 = 手动挑的未学词 + 自动补足到 4 个 */
function todayNewCount(){ return Math.max(4, pickedExtra().length); }
function buildQueue(){
  const picked=pickedExtra();
  const fresh=picked.concat(freshWords(Math.max(0,4-picked.length), pickedSet(picked)));
  let rev=dueWords();
  const q=[]; let fi=0, ri=0;
  // 收尾保护：最后 60 秒只取熟练词 —— 运行时再过滤，这里只做交错
  while(fi<fresh.length || ri<rev.length){
    if(ri<rev.length){ q.push({w:rev[ri++],kind:'rev'}); }
    if(ri<rev.length){ q.push({w:rev[ri++],kind:'rev'}); }
    if(fi<fresh.length){ q.push({w:fresh[fi++],kind:'new'}); }
    if(ri>=rev.length && fi<fresh.length){ while(fi<fresh.length) q.push({w:fresh[fi++],kind:'new'}); }
  }
  return {fresh,rev,q};
}

/* ---------- 拼写 ---------- */
function buildQuizQueue(){
  // 把复习词与新词交错，新词顺序打乱
  const fresh=shuffle(T.fresh).map(w=>({w,kind:'new'}));
  const rev=dueWords().map(w=>({w,kind:'rev'}));
  const q=[]; let fi=0,ri=0;
  while(fi<fresh.length||ri<rev.length){
    if(ri<rev.length) q.push(rev[ri++]);
    if(fi<fresh.length) q.push(fresh[fi++]);
    if(ri<rev.length&&Math.random()<.7) q.push(rev[ri++]);
  }
  return q;
}
function startHint(w){
  const st=ws(w);
  if(st.hint===1) return 1;   // 上次用到 L2/L3 → 从 L1 起步
  if(st.hint===0) return 0;   // 上次用 L1 → 直接无提示
  return 0;
}
function nextWord(){
  // 收尾保护：剩余 < 60 秒优先取熟练词，保证结尾是爽的
  if(T.timeLeft<60){
    let j=T.qi;
    while(j<T.q.length && ws(T.q[j].w).st<2) j++;
    if(j<T.q.length && j>T.qi){ const it=T.q.splice(j,1)[0]; T.q.splice(T.qi,0,it); }
  }
  // 跳过已失效的词（自定义词被删/词表缺失），避免 BY_W[w] 取不到而卡死
  while(T.qi<T.q.length && !BY_W[T.q[T.qi].w]) T.qi++;
  if(T.qi>=T.q.length||T.timeLeft<=0){ finish(); return; }
  const it=T.q[T.qi], w=BY_W[it.w];
  let mode;
  if(ws(it.w).st===0&&it.kind==='new'){ mode='pic'; const _s=ws(it.w); if(_s.modes.indexOf('pic')<0) _s.modes.push('pic'); }
  else mode=pickMode(it.w);
  const hint=startHint(it.w);
  T.cur={ w:w.w, mode, hint, pos:0, wrongAt:-1, startAt:Date.now() };
  buildSlots();
  render();
}
const AUTO_CH=' -';                        // 空格与连字符：不是拼写考察点，永远自动预填
const isAuto=ch=>AUTO_CH.indexOf(ch)>=0;
function traceSeq(c){ const o=[]; c.cells.forEach((x,i)=>{ if(!isAuto(x.ch)) o.push(i); }); return o; }
function buildSlots(){
  const c=T.cur, t=c.w;
  c.cells=t.split('').map(ch=>({ch,locked:false,val:'',done:false,br:false}));
  // 空格 / 连字符永远自动填好
  c.cells.forEach(x=>{ if(isAuto(x.ch)){ x.locked=true; x.val=x.ch; } });
  // 按读音分段（只分段，不显示音节字母）；从第 1 级提示起才显示
  if(c.hint>=1){
    const sy=(BY_W[t]&&BY_W[t].syl)||[t];
    if(sy.length>1){
      let p=0;
      for(let k=0;k<sy.length-1;k++){
        p+=sy[k].length;
        if(c.cells[p]&&!isAuto(c.cells[p].ch)) c.cells[p].br=true;
      }
    }
  }
  if(c.hint===1){
    const first=c.cells.find(x=>!isAuto(x.ch));
    if(first){ first.locked=true; first.val=first.ch; }
  } else if(c.hint===2){
    c.cells.forEach(x=>{ if(!isAuto(x.ch)&&!VOWELS.includes(x.ch)){ x.locked=true; x.val=x.ch; } });
    if(c.cells.every(x=>x.locked)){ // 没有元音可填（如 why / fly），留最后一个辅音给孩子
      const last=[...c.cells].reverse().find(x=>!isAuto(x.ch));
      if(last){ last.locked=false; last.val=''; }
    }
  } else if(c.hint===3){
    c.trace=true; c.pos=0;
    c.cells.forEach(x=>{ if(!isAuto(x.ch)){ x.locked=true; x.val=x.ch; } });
  }
}
function slotsHTML(){
  const c=T.cur;
  const seq=traceSeq(c);
  const curIdx = c.trace ? seq[c.pos] : curFill();
  let out='';
  c.cells.forEach((x,i)=>{
    if(x.br) out+='<div class="slot gap"></div>';   // 读音分段处的空隙
    if(x.ch===' '){ out+='<div class="slot gap"></div>'; return; }
    let cls='slot';
    if(x.locked) cls+=' locked';
    if(c.trace&&x.done) cls+=' ok'; else if(x.val) cls+=' filled';
    if(i===curIdx) cls+=' cur';
    if(c.wrongAt===i) cls+=' err';
    out+='<div class="'+cls+'">'+esc(x.val)+'</div>';
  });
  return out;
}
function curFill(){
  const c=T.cur;
  for(let i=0;i<c.cells.length;i++) if(!c.cells[i].locked&&!c.cells[i].val) return i;
  return -1;
}
function quizHTML(){

  const sylRow = c.hint>=3

      <button class="btn ghost" id="del">⌫ 退格</button>
      ${c.mode!=='audio'?'<button class="btn ghost" id="say2">🔊 听读音</button>':''}
      ${c.hint<3?'<button class="btn ghost" id="hint">💡 给点提示</button>':''}
    </div>

}
function kbHTML(){
  const c=T.cur;
  let need='';
  // 只有第 3 级提示（照打）才在键盘上高亮下一个键；L1/L2 不给键盘答案
  if(c.hint>=3){
    if(c.trace){ const seq=traceSeq(c); const i=seq[c.pos]; need=(c.cells[i]?c.cells[i].ch:'').toLowerCase(); }
    else { const i=curFill(); if(i>=0) need=c.cells[i].ch.toLowerCase(); }
  }
  const rows=KB_ROWS.map(r=>'<div class="kbrow">'+r.map(k=>{
    const f=CH2FG[k]||'';
    let cls='k'+(need===k?' target':'');
    return '<button class="'+cls+'" data-k="'+k+'" style="background:'+(FG_COLOR[f]||'#fff')+'">'+k+'</button>';
  }).join('')+'</div>').join('');
  return '<div class="kb">'+rows+
    '<div class="kbrow"><button class="k wide" data-k=" " style="background:#eceaf2">空格</button>'+
    '<button class="k wide" data-k="bk" style="background:#ffe4ef">退格</button></div></div>';
}
function bindQuiz(){
  const c=T.cur;
  if($('play')) $('play').onclick=()=>speak(c.w);
  $('del').onclick=()=>{ sfx.tap(); backspace(); };
  const sb=$('say2'); if(sb) sb.onclick=()=>{ T.cur.usedAudio=true; sfx.tap(); speak(c.w); };
  const hb=$('hint'); if(hb) hb.onclick=()=>{ raiseHint(true); };
  document.querySelectorAll('.kb .k').forEach(b=>{
    b.onclick=()=>{ const k=b.dataset.k; if(k==='bk'){ sfx.tap(); backspace(); } else type(k); };
  });
}
function type(ch){
  const c=T.cur; if(!c) return;
  sfx.tap();
  if(c.trace){
    const seq=traceSeq(c), i=seq[c.pos], cell=c.cells[i];
    if(!cell) return;
    if(norm(cell.ch)===norm(ch)){
      cell.done=true; c.pos++; c.wrongAt=-1;
      if(c.pos>=seq.length){ setTimeout(submit,160); return; }
      render();
    } else {
      c.wrongAt=i; render(); sfx.wrong();
      setTimeout(()=>{ if(T&&T.cur){ T.cur.wrongAt=-1; render(); } },400);
    }
    return;
  }
  const i=curFill(); if(i<0) return;
  c.cells[i].val=ch; c.wrongAt=-1;   // 填孩子实际按下的键，判定忽略大小写
  if(curFill()<0) setTimeout(submit,140); else render();
}
function backspace(){
  const c=T.cur; if(!c) return;
  if(c.trace){ if(c.pos>0){ c.pos--; const seq=traceSeq(c); c.cells[seq[c.pos]].done=false; } render(); return; }
  for(let i=c.cells.length-1;i>=0;i--){ if(!c.cells[i].locked&&c.cells[i].val){ c.cells[i].val=''; break; } }
  render();
}
function raiseHint(auto){
  const c=T.cur;
  if(c.hint>=3) return;
  c.hint++; c.wrongAt=-1;
  buildSlots(); render();
  if(!auto) toast('提示用掉啦，这个词明天再来找你');
}
function submit(){
  const c=T.cur; if(!c) return;
  const val=c.cells.map(x=>x.val||'').join('');
  const ok=norm(val)===norm(c.w);
  const st=ws(c.w);

  /* ---- 拼错：先升级提示，不计数、不推进 ---- */
  if(!ok){
    if(c.hint<3){
      const err=classify(val,c.w)||{type:'other',msg:'再试一次'};
      sfx.wrong();
      c.hint++; c.wrongAt=-1; buildSlots();
      toast(c.hint===3?'照着打一遍，记住它 ✍️':err.msg.replace(/<[^>]+>/g,''));
      render(); return;
    }
    // 照打（L3）仍没打完 —— 说明这次没拿下
    sfx.wrong();
    T.stat.total++;
    st.fails++; st.streakNH=0; st.hint=3; st.st=0; st.due=dayNum()+1;
    T.done.push({w:c.w,hint:3,ok:false});
    save(); T.qi++; T.cur=null;
    setTimeout(nextWord,300);
    return;
  }

  /* ---- 拼对 ---- */
  sfx.right(); st.right++; T.stat.total++;
  if(c.hint===0){
    if(c.usedAudio){
      /* 听着读音拼出来的：也算通过——读音是发音辅助而非偷看拼写，掌握度照常推进；
         但“零提示连胜”仍清零（借助了读音，不算零提示），“零提示拼对”统计也不计入（不拿抽奖券） */
      st.streakNH=0; st.hint=0; st.st=Math.min(3,st.st+1); st.due=dayNum()+1;
    } else {
      st.streakNH++; T.stat.noHint++; st.hint=-1;
      st.st = st.streakNH>=5 ? 3 : (st.streakNH>=2 ? 2 : 1);
      const gap=[1,1,2,4,7,15][Math.min(st.streakNH,5)]||15;
      st.due = dayNum() + (st.st>=3?15:gap);
    }
  } else {
    // 用了提示：不算真正通过 —— 明天必现、换考法、提示收紧
    T.stat.usedHint++; st.streakNH=0; st.fails++;
    st.hint=c.hint; st.st=Math.max(0,st.st-1); st.due=dayNum()+1;
  }
  T.done.push({w:c.w,hint:c.hint,ok:true});
  if(S.extra && S.extra.length && st.st>0){ S.extra=S.extra.filter(function(w){ return w!==c.w; }); }  // 学会了，移出「今天想学」
  save(); T.qi++; T.cur=null;
  setTimeout(nextWord,260);
}

/* ---------- 结算 ---------- */
function finish(reason){
  if(T.phase==='result') return;
  T.phase='result'; T.endReason=reason||'';
  const st=S.day;
  // 统计
  const total=T.stat.total, noHint=T.stat.noHint;
  const recogn=Math.min(total, total); // P0：认得分 = 完成数（词卡都看过）
  T.result={ total, noHint, recogn:total };
  // 每日完成判定（第一天只有 4 个新词，也要算完成）
  T.completed = total>=4;
  if(T.completed){
    const td=today();
    if(S.lastDay!==td){
      const y=new Date(Date.now()-86400000);
      const ystr=y.getFullYear()+'-'+(y.getMonth()+1)+'-'+y.getDate();
      S.streak = (S.lastDay===ystr)? S.streak+1 : 1;
      S.lastDay=td;
      const dow=(new Date().getDay()+6)%7; S.week[dow]=true;
      let t=1;
      if(noHint>=8) t+=2;
      if(S.streak>0&&S.streak%3===0) t+=3;
      if(S.week.filter(Boolean).length>=7&&!S.gacha.weeklyDone){ t+=10; S.gacha.weeklyDone=true; S.week=[false,false,false,false,false,false,false]; }
      S.gacha.tickets+=t; T.got=t;
    }
  }
  save(); render(); sfx.win();
}

/* ---------- 抽奖 ---------- */
function gacha(){
  if(S.gacha.tickets<=0){ toast('没有抽奖券啦，明天再来'); return; }
  S.gacha.tickets--; S.gacha.total++;
  const order=['R','S','SR','SSR'];
  // 家长关闭了抽奖：不做随机，按顺序直接获得还没拥有的那一件
  if(!S.settings.gacha){
    const pool=ITEMS.filter(i=>!S.gacha.owned.includes(i.id)).sort((a,b)=>order.indexOf(a.rar)-order.indexOf(b.rar));
    const got=pool[0]||ITEMS[0];
    if(!S.gacha.owned.includes(got.id)) S.gacha.owned.push(got.id); else S.gacha.star+=5;
    S.equip[got.slot]=got.id; save(); sfx.win();
    showGacha(got,false);
    return;
  }
  const pool=ITEMS.filter(i=>!S.gacha.owned.includes(i.id));
  let pick;
  const W={SSR:8,SR:16,S:28,R:48};
  let forceSR=S.gacha.pity>=9, forceSSR=S.gacha.total%50===0;
  let cand=pool.length?pool:ITEMS;
  let cs=cand;
  if(forceSSR) cs=cand.filter(i=>i.rar==='SSR');
  else if(forceSR) cs=cand.filter(i=>i.rar==='SR'||i.rar==='SSR');
  if(!cs.length) cs=cand;
  const tot=cs.reduce((a,b)=>a+(W[b.rar]||10),0);
  let r=Math.random()*tot;
  for(const it of cs){ r-=(W[it.rar]||10); if(r<=0){ pick=it; break; } }
  if(!pick) pick=cs[cs.length-1];
  const dup=S.gacha.owned.includes(pick.id);
  if(!dup) S.gacha.owned.push(pick.id); else S.gacha.star+=5;
  S.gacha.pity=(pick.rar==='SR'||pick.rar==='SSR')?0:S.gacha.pity+1;
  save(); sfx.gacha();
  showGacha(pick,dup);
}
function showGacha(it,dup){
  const prev=S.equip[it.slot];
  S.equip[it.slot]=it.id; save();
  openModal(`

    ${BODY_SVG}

    ${dress?dress.svg:''}
    ${hair&&hair.front?hair.front:''}
    ${neck?neck.svg:''}
    ${head?head.svg:''}
    ${pet&&!pet.behind?pet.svg:''}
    ${food?food.svg:''}
    ${hand?hand.svg:''}
  </svg>`;
}
let wardTab='dress';
function wardrobe(){
  openModal(`
   <h3>🎀 我的衣柜</h3>
   <div class="dollbox"><div>${dollHTML(200,254)}</div>
   <div style="flex:1;min-width:200px">
     <div class="tabs" id="tabs">
       ${SLOT_ORDER.map(s=>'<button class="tab'+(wardTab===s?' on':'')+'" data-s="'+s+'">'+SLOT_NAME[s]+'<span style="font-size:11px;opacity:.65;margin-left:3px">'+ITEMS.filter(i=>i.slot===s&&S.gacha.owned.includes(i.id)).length+'/'+ITEMS.filter(i=>i.slot===s).length+'</span></button>').join('')}
     </div>
     <div class="items" id="items"></div>
   </div></div>
   <div class="row" style="justify-content:center;margin-top:16px"><button class="btn" id="closeW">完成</button></div>`);
  const drawItems=()=>{
    const list=ITEMS.filter(i=>i.slot===wardTab);
    $('items').innerHTML=list.map(i=>{
      const owned=S.gacha.owned.includes(i.id);
      const on=S.equip[i.slot]===i.id;
      return '<div class="item'+(on?' on':'')+(owned?'':' locked')+'" data-id="'+i.id+'">'+
        '<svg viewBox="0 0 300 380" width="56" height="70">'+thumb(i)+'</svg>'+
        '<div class="nm">'+(owned?esc(i.name):'？？？')+'</div>'+
        '<div class="rar '+i.rar+'" style="font-size:10px;padding:1px 7px;margin-top:3px">'+i.rar+'</div>'+
      '</div>';
    }).join('');
    document.querySelectorAll('#items .item').forEach(el=>{
      el.onclick=()=>{
        const id=el.dataset.id;
        if(!S.gacha.owned.includes(id)){ toast('还没抽到哦，继续加油！'); return; }
        // 背景/发型/裙子必须始终有一件；头饰（发饰）可点击取消
        if(NULLABLE[wardTab]) S.equip[wardTab]= (S.equip[wardTab]===id)?null:id;
        else S.equip[wardTab]=id;
        save(); wardrobe();
      };
    });
  };
  document.querySelectorAll('#tabs .tab').forEach(b=>{
    b.onclick=()=>{ wardTab=b.dataset.s; wardrobe(); };
  });
  drawItems();
  $('closeW').onclick=()=>{ closeModal(); render(); };
}
function thumb(i){
  const SK='#ffe3cb';
  if(i.slot==='bg'||i.slot==='pet'||i.slot==='food') return i.svg;
  if(i.slot==='hair') return (i.back||'')+'<circle cx="150" cy="112" r="52" fill="'+SK+'"/><circle cx="131" cy="112" r="5" fill="#4a3b52"/><circle cx="169" cy="112" r="5" fill="#4a3b52"/><path d="M143 134 q7 8 14 0" stroke="#e07a9a" stroke-width="3.5" fill="none" stroke-linecap="round"/>'+(i.front||'');
  if(i.slot==='dress') return '<path d="M118 166 h64 v56 a32 32 0 0 1 -64 0z" fill="'+SK+'"/><circle cx="150" cy="112" r="52" fill="'+SK+'"/>'+i.svg;
  if(i.slot==='shoes') return '<rect x="126" y="250" width="20" height="74" rx="10" fill="'+SK+'"/><rect x="154" y="250" width="20" height="74" rx="10" fill="'+SK+'"/>'+i.svg;
  if(i.slot==='back') return '<path d="M118 166 h64 v56 a32 32 0 0 1 -64 0z" fill="'+SK+'"/>'+i.svg;
  if(i.slot==='neck') return '<path d="M118 166 h64 v56 a32 32 0 0 1 -64 0z" fill="'+SK+'"/><circle cx="150" cy="112" r="52" fill="'+SK+'"/>'+i.svg;
  return '<circle cx="150" cy="112" r="52" fill="'+SK+'"/><circle cx="131" cy="112" r="5" fill="#4a3b52"/><circle cx="169" cy="112" r="5" fill="#4a3b52"/>'+i.svg;
}

/* ---------- 单词列表 ---------- */
const ST_LABEL=['未学','拼得出','熟练','已掌握'];
const UNIT_NAME={1:'Unit 1 · 在家帮忙',2:'Unit 2 · 我的朋友',3:'Unit 3 · 居住的地方',4:'Unit 4 · 社区帮忙',5:'Unit 5 · 天气与我们',6:'Unit 6 · 四季变化',else:'拓展词 · else（Unit 6 之后，手工录入）',
  d1:'DAY 1',d2:'DAY 2',d3:'DAY 3',d4:'DAY 4',d5:'DAY 5',d6:'DAY 6',d7:'DAY 7',d8:'DAY 8',d9:'DAY 9',d10:'DAY 10',
  d11:'DAY 11',d12:'DAY 12',d13:'DAY 13',d14:'DAY 14',d15:'DAY 15',d16:'DAY 16',d17:'DAY 17',d18:'DAY 18',d19:'DAY 19',d20:'DAY 20'};
const WL_TABS=[['all','全部'],['learned','学过'],['grad','已掌握'],['due','待复习']];
const WL_TITLE={all:'全部单词',learned:'学过的词',grad:'已掌握的词',due:'今天要复习'};
function stOf(w){ const s=S.words[w]; return s?s.st:0; }          // 只读，不创建记录
function dueOf(w){ const s=S.words[w]; return s?s.due:0; }
function listWords(kind){
  if(kind==='all') return WORDS.slice();
  if(kind==='due'){ const set={}; dueWords().forEach(w=>set[w]=1); return WORDS.filter(x=>set[x.w]); }
  if(kind==='learned') return WORDS.filter(x=>stOf(x.w)>0);
  if(kind==='grad') return WORDS.filter(x=>stOf(x.w)>=3);
  return [];
}
let wlTab='all';
function wordList(kind){
  wlTab=kind||'all';
  $('modal').classList.add('wide');
  onModalClose=()=>{ $('modal').classList.remove('wide'); render(); };
  openModal(
    '<h3 id="wlTitle"></h3>'+
    '<div class="tabs" id="wlTabs">'+WL_TABS.map(t=>'<button class="tab" data-k="'+t[0]+'">'+t[1]+'</button>').join('')+'</div>'+
    '<div id="wlBody"></div>'+
    '<div class="row" style="justify-content:center;margin-top:14px">'+
      '<button class="btn ghost" id="wlAdd">＋ 添加单词 / 词组</button>'+
      '<button class="btn" id="wlClose">完成</button>'+
    '</div>'
  );
  document.querySelectorAll('#wlTabs .tab').forEach(b=>{
    b.onclick=()=>{ wlTab=b.dataset.k; drawWL(); };
  });
  $('wlAdd').onclick=()=>addWordForm();
  $('wlClose').onclick=()=>{ const f=onModalClose; onModalClose=null; if(f) f(); closeModal(); };
  drawWL();
}
function drawWL(){
  const list=listWords(wlTab);
  $('wlTitle').textContent=WL_TITLE[wlTab]+' '+list.length;
  document.querySelectorAll('#wlTabs .tab').forEach(b=>{
    const t=WL_TABS.filter(x=>x[0]===b.dataset.k)[0];
    b.textContent=t[1]+' '+listWords(b.dataset.k).length;
    if(b.dataset.k===wlTab) b.classList.add('on'); else b.classList.remove('on');
  });
  const body=$('wlBody');
  if(!list.length){
    body.innerHTML=wlEmpty(wlTab);
    const g=$('wlGo'); if(g) g.onclick=()=>{ const f=onModalClose; onModalClose=null; if(f) f(); closeModal(); startDay(); };
    return;
  }
  let html='', units=[];
  list.forEach(x=>{ if(units.indexOf(x.u)<0) units.push(x.u); });
  units.forEach(u=>{
    const grp=list.filter(x=>x.u===u);
    html+='<div class="wgrp">'+(UNIT_NAME[u]||('Unit '+u))+' · '+grp.length+' 词</div>';
    grp.forEach(x=>{ html+=wlRow(x); });
  });
  body.innerHTML=html;
  body.querySelectorAll('.wrow').forEach(r=>{
    r.onclick=e=>{ if(e.target.className.indexOf('wmini')>=0) return; speak(r.dataset.w); };
  });
  body.querySelectorAll('.wmini').forEach(b=>{
    b.onclick=e=>{
      e.stopPropagation();
      if(b.classList.contains('dim')){
        toast(stOf(b.dataset.w)===0 ? '还没学过这个词，做任务就会遇到它' : '它本来就在今天的复习里');
        return;
      }
      if(b.dataset.act==='rev') addReview(b.dataset.w);
      else if(b.dataset.act==='today') toggleToday(b.dataset.w);
      else if(b.dataset.act==='delc') delCustom(b.dataset.w);
      else markKnown(b.dataset.w);
      drawWL();
    };
  });
}
function wlRow(x){
  const st=stOf(x.w), dueNow=st>0&&dueOf(x.w)<=dayNum();
  let act='';
  if(st===0){
    const inToday=S.extra && S.extra.indexOf(x.w)>=0;
    act='<button class="wmini'+(inToday?' on':'')+'" data-w="'+esc(x.w)+'" data-act="today">'+(inToday?'已在今天 ✓':'加入今天')+'</button>';
  }
  else act='<button class="wmini'+(dueNow?' dim':'')+'" data-w="'+esc(x.w)+'" data-act="rev">加入复习</button>'+
           '<button class="wmini" data-w="'+esc(x.w)+'" data-act="know">'+(st>=3?'取消已会':'标为已会')+'</button>';
  if(x.custom) act+='<button class="wmini del" data-w="'+esc(x.w)+'" data-act="delc" title="删除这个自定义词">✕</button>';
  return '<div class="wrow" data-w="'+esc(x.w)+'">'+
    '<span class="w">'+esc(x.w)+'</span>'+
    '<span class="cn">'+esc(x.cn)+'</span>'+
    '<span class="wbadge b'+st+'">'+ST_LABEL[st]+'</span>'+act+
  '</div>';
}
function wlEmpty(kind){
  if(kind==='learned') return '<div class="wempty">还没有学过的词 🫧<br>去开始今天的任务吧</div>'+
    '<div class="row" style="justify-content:center"><button class="btn" id="wlGo">开始任务 →</button></div>';
  if(kind==='grad') return '<div class="wempty">还没有毕业的词 🌱<br>一个词要连续 5 次不看提示拼对，才算真正掌握。</div>';
  if(kind==='due') return '<div class="wempty">今天的复习都完成啦 🎉<br>明天再来，会有新的词等着你。</div>';
  return '<div class="wempty">这里还没有词</div>';
}
function addReview(w){
  const s=ws(w);
  if(s.st===0){ toast('还没学过这个词，做任务就会遇到它'); return; }
  if(s.due<=dayNum()){ toast('它本来就在今天的复习里'); return; }
  s.due=dayNum(); s.fails=Math.max(s.fails,0); save(); toast('已加入今天的复习');
}
function markKnown(w){
  const s=ws(w);
  if(s.st>=3){ s.st=2; s.streakNH=2; s.due=dayNum()+2; save(); toast('取消「已会」，回到熟练档'); }
  else { s.st=3; s.streakNH=5; s.hint=-1; s.due=dayNum()+15; save(); toast('已标为已会，15 天后再来找你'); }
}
/* 未学词：加入 / 移出「今天的学习」 */
function toggleToday(w){
  S.extra=S.extra||[];
  const i=S.extra.indexOf(w);
  if(i>=0){ S.extra.splice(i,1); toast('已移出今天的学习'); }
  else { S.extra.push(w); toast('已加入今天的学习 🌟'); }
  save(); drawWL();
}
/* 删除手工录入的词：两个档案进度一起清掉 */
function delCustom(w){
  if(!confirm('删除「'+w+'」？两个小朋友的进度也会一起清掉。')) return;
  ROOT.extra=ROOT.extra.filter(function(x){ return x.w!==w; });
  ROOT.profiles.forEach(function(p){ if(p.words && p.words[w]) delete p.words[w]; });
  ROOT.profiles.forEach(function(p){ if(p.extra) p.extra=p.extra.filter(function(x){ return x!==w; }); });
  useBook(S.book); save(); toast('已删除：'+w);
  if(document.getElementById('wlTitle')) drawWL(); else wordList(wlTab);   // 在词表里删就原地刷新，否则回到词表
}
/* ---------- 手工录入单词 / 词组 ---------- */
function addWordForm(){
  openModal(
    '<h3>＋ 添加单词 / 词组</h3>'+
    '<div class="wgrp">会放进「else 组」（Unit 6 之后），两个小朋友共用同一份</div>'+
    '<div class="namerow"><span class="muted">英文</span><input id="aw_w" placeholder="如 hello 或 good morning" autocomplete="off"></div>'+
    '<div class="namerow"><span class="muted">中文</span><input id="aw_cn" placeholder="如 你好" autocomplete="off"></div>'+
    '<div class="namerow"><span class="muted">例句英</span><input id="aw_s" placeholder="可选（英文例句）" autocomplete="off"></div>'+
    '<div class="namerow"><span class="muted">例句中</span><input id="aw_sc" placeholder="可选（中文翻译）" autocomplete="off"></div>'+
    '<div class="muted" style="margin-top:6px">不填音节：词组按空格分段、单词整体算一段；两个框都填了才会保存。</div>'+
    '<div class="row" style="justify-content:center;margin-top:14px">'+
      '<button class="btn ghost" id="awCancel">取消</button>'+
      '<button class="btn" id="awSave">保存</button>'+
    '</div>'
  );
  $('awCancel').onclick=()=>wordList(wlTab);
  $('awSave').onclick=()=>saveCustomWord();
}
function saveCustomWord(){
  const w=($('aw_w').value||'').trim().replace(/\s+/g,' ').toLowerCase();
  const cn=($('aw_cn').value||'').trim();
  if(!w){ toast('先填英文哦'); return; }
  if(!cn){ toast('先填中文意思哦'); return; }
  if(w.length>40){ toast('这个词太长啦，短一点'); return; }
  if(BY_W[w] && !confirm('「'+w+'」已经在词表里了，还要再添一份吗？')) return;
  const syl = w.indexOf(' ')>0 ? w.split(' ') : [w];   // 词组按空格分、单词整体一段
  ROOT.extra.push({w:w, cn:cn, syl:syl, u:'else', s:($('aw_s').value||'').trim(), sc:($('aw_sc').value||'').trim(), custom:1});
  useBook(S.book); save(); toast('已添加：'+w+' ✓');
  wordList(wlTab);
}

/* ---------- 弹窗 ---------- */
let onModalClose=null;
function openModal(html){ $('modal').innerHTML=html; $('mask').classList.add('show'); }
function closeModal(){ $('mask').classList.remove('show'); $('modal').innerHTML=''; }
$('mask').addEventListener('click',e=>{ if(e.target.id==='mask'){ closeModal(); if(T&&T.phase==='result'){ T=null; render(); } if(onModalClose){ const f=onModalClose; onModalClose=null; f(); } } });
$('btnSet').onclick=()=>{
  openModal(`
   <h3>⚙️ 设置</h3>
   <div style="text-align:left">
     <div class="wgrp">${esc(S.name)} 的档案</div>
     <div class="namerow"><span class="muted">名字</span><input id="setName" maxlength="6" value="${esc(S.name)}"></div>
     <div class="avpick">${AVATARS.map(function(a,i){ return '<button class="avbtn'+(i===S.av?' on':'')+'" data-i="'+i+'" title="'+a.n+'">'+avatarSVG(i,40)+'</button>'; }).join('')}</div>
   </div>
   <div style="text-align:left;margin-top:6px">
     <div class="wgrp">${esc(S.name)} 的学习设置</div>
     <label class="row spread" style="padding:10px 0"><span>音效</span><input type="checkbox" id="setSound" ${S.settings.sound?'checked':''}></label>
     <label class="row spread" style="padding:10px 0"><span>朗读单词</span><input type="checkbox" id="setTts" ${S.settings.tts?'checked':''}></label>
     <label class="row spread" style="padding:10px 0"><span>抽奖（关闭后直接获得）</span><input type="checkbox" id="setGacha" ${S.settings.gacha?'checked':''}></label>
   </div>
   ${ROOT.profiles.length>1?('<div style="text-align:left;margin-top:6px"><div class="wgrp">切换小朋友</div><div class="row" style="gap:8px;flex-wrap:wrap">'
     +ROOT.profiles.map(function(p,i){ return i===ROOT.cur?'':'<button class="btn ghost smallbtn" data-sw="'+i+'">'+avatarSVG(p.av,22)+' 换成 '+esc(p.name)+'</button>'; }).join('')
     +'</div></div>'):''}
   <div class="muted" style="margin-top:10px;text-align:left">两个人进度完全分开，各自学各自的、各自攒各自的衣柜。<br>进度保存在这台设备的浏览器里，换设备或清缓存会丢失。</div>
   <div class="row" style="justify-content:center;margin-top:16px">
     <button class="btn ghost" id="reset">重置 ${esc(S.name)}</button>
     <button class="btn" id="closeSet">完成</button>
   </div>`);
  $('setName').oninput=e=>{ S.name=e.target.value.trim()||'小朋友'; };
  $('setName').onblur=()=>{ save(); };
  Array.prototype.forEach.call(document.querySelectorAll('.avbtn'),function(b){
    b.onclick=function(){ S.av=parseInt(b.dataset.i,10); save();
      Array.prototype.forEach.call(document.querySelectorAll('.avbtn'),function(x){ x.classList.remove('on'); });
      b.classList.add('on'); };
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-sw]'),function(b){
    b.onclick=function(){ switchTo(parseInt(b.dataset.sw,10)); };
  });
  $('setSound').onchange=e=>{ S.settings.sound=e.target.checked; save(); };
  $('setTts').onchange=e=>{ S.settings.tts=e.target.checked; save(); };
  $('setGacha').onchange=e=>{ S.settings.gacha=e.target.checked; save(); };
  $('reset').onclick=()=>resetCur();
  $('closeSet').onclick=()=>{ save(); closeModal(); render(); };
};

/* ---------- 计时器 ---------- */
setInterval(()=>{
  if(!T||T.phase==='result') return;
  T.timeLeft--;
  if(T.timeLeft<=0){ finish('time'); return; }
  const bar=document.querySelector('.timer .bar i');
  if(bar) bar.style.width=Math.max(0,T.timeLeft/ROUND_ADD[0]*100)+'%';
  const p=document.querySelectorAll('.timer .pill')[1];
  if(p) p.textContent=Math.ceil(T.timeLeft/60)+' 分';
},1000);

/* ---------- 物理键盘 ---------- */
window.addEventListener('keydown',e=>{
  if($('mask').classList.contains('show')) return;
  if(!T||!T.cur) return;
  if(e.key==='Backspace'){ e.preventDefault(); backspace(); return; }
  if(e.key==='Enter'){ e.preventDefault(); if(!T.cur.trace) submit(); return; }
  if(e.key.length===1&&/[a-zA-Z' ]/.test(e.key)){ e.preventDefault(); type(e.key); }
});

render();
</script>
